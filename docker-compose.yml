version: '3.9'

services:
  migrate:
    build: ./backend
    command: python manage.py migrate
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      store_db:
        condition: service_healthy

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

  test:
    build: ./backend
    command: pytest -v
    profiles:
      - test
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      store_db:
        condition: service_healthy

  store_db:
    image: mysql:8
    container_name: store_db
    environment:
      MYSQL_DATABASE: ${STORE_DB_NAME}
      MYSQL_USER: ${STORE_DB_USER}
      MYSQL_PASSWORD: ${STORE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${STORE_DB_ROOT_PASSWORD:-root}
    volumes:
      - store_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  store_db_data:
